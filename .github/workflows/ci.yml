name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # remover no P0 #7
      - run: npm run lint
        continue-on-error: true

      - run: npx tsc --noEmit

      - run: npx vitest run

      - run: npm audit --omit=dev --audit-level=high

      - run: npm run build
